[project]
name = "pill-object-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "torchmetrics[image]>=1.9.0",
    "torchvision>=0.29.1",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
