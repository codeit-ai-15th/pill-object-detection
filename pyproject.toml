[project]
name = "pill-object-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
    "torch>=2.14.1",
    "torchmetrics[image]>=1.9.0",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.183",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

# 프로젝트 이름은 pill-object-detection, import 이름은 pill_detection
[tool.uv.build-backend]
module-name = "pill_detection"
