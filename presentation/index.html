<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="doctitle">목차</title>
<link rel="stylesheet" href="deck.css">
</head>
<body class="index-body">
  <header class="index-head">
    <h1 id="deck-title"></h1>
    <p class="index-sub" id="deck-sub"></p>
  </header>
  <nav class="toc" id="toc" aria-label="슬라이드 목차"></nav>

  <!-- 이 index.html은 어떤 발표에도 그대로 재사용됩니다. 내용은 slides.js가 결정합니다. -->
  <script src="slides.js"></script>
  <script>
  (function(){
    var D = window.DECK || {};
    document.getElementById('deck-title').textContent = D.title || '프레젠테이션';
    document.getElementById('doctitle').textContent  = (D.title || '프레젠테이션') + ' — 목차';
    var sub = document.getElementById('deck-sub');
    if(D.subtitle){ sub.textContent = D.subtitle; } else { sub.remove(); }

    /* 섹션 → 색상 매핑 */
    var color = {};
    (D.sections || []).forEach(function(s){ color[s.name] = s.color; });

    var toc = document.getElementById('toc');
    var curSection = null, grid = null;
    (D.slides || []).forEach(function(s){
      var c = color[s.section] || '#888';
      if(s.section !== curSection){              /* 새 섹션 밴드 시작 */
        curSection = s.section;
        var band = document.createElement('section');
        band.className = 'toc-group';
        band.style.setProperty('--sec', c);
        var h = document.createElement('h2');
        h.className = 'toc-group__title';
        h.textContent = s.section;
        band.appendChild(h);
        grid = document.createElement('div');
        grid.className = 'toc-grid';
        band.appendChild(grid);
        toc.appendChild(band);
      }
      var a = document.createElement('a');       /* 슬라이드 카드 */
      a.className = 'card';
      a.href = s.file;
      a.style.setProperty('--sec', c);
      var n = document.createElement('span'); n.className = 'card__n'; n.textContent = s.n;
      var t = document.createElement('span'); t.className = 'card__t'; t.textContent = s.title;
      a.appendChild(n); a.appendChild(t);
      grid.appendChild(a);
    });
  })();
  </script>
</body>
</html>
