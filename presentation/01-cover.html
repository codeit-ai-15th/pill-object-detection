<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>표지 · 경구약제 이미지 객체 검출</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<main class="deck" aria-roledescription="presentation">
  <div class="stage">
    <div class="counter"><span class="cur">1</span><span class="sep"> / </span><span class="total">0</span></div>

    <section class="slide cover" aria-label="표지">
      <h1><span class="o">경구약제 이미지 객체 검출</span><br>알약 사진 한 장에서<br>위치와 약 이름을 찾습니다</h1>
      <div class="bar"></div>
      <p class="org">코드잇 AI 15기 초급 프로젝트 1 · 2팀</p>
      <p class="names">강래우, 이채정, 이채영, 임재원</p>
      <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
        <g transform="rotate(-38 100 100)">
          <rect x="20" y="62" width="160" height="76" rx="38" fill="#FFF7DF" stroke="#F9A61C" stroke-width="5"/>
          <path d="M100 62H58a38 38 0 0 0 0 76h42z" fill="#F9A61C"/>
        </g>
      </svg>
      <aside class="notes">코드잇 AI 15기 초급 프로젝트 1, 2팀 발표를 시작합니다.</aside>
    </section>

  </div>

  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
    <span class="progress__bar"></span>
  </div>
  <a class="home" href="index.html" title="목차로">▦</a>
  <div class="hint">← →/Space 이동 · N 노트 · Esc 목차</div>
  <div class="notes-overlay"><h4>SPEAKER NOTES</h4><div class="notes-body"></div></div>
</main>

<script src="slides.js"></script>
<script src="deck.js"></script>
</body>
</html>
