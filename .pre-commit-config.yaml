# hook 로직은 hooks/에 스크립트로 두고, 여기에는 등록만 한다
repos:
  - repo: local
    hooks:
      # pyproject.toml만 고치고 uv lock을 안 돌린 커밋을 막는다
      - id: uv-lock-check
        name: uv.lock이 pyproject.toml과 일치하는지 확인
        entry: python hooks/uv_lock_check.py
        language: python
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # 노트북 출력을 지우는 nbstripout git 필터가 이 저장소에 설정되어 있지 않으면 설정한다
      - id: nbstripout-setup
        name: 노트북 출력 제거 필터(nbstripout) 설정 확인
        entry: python hooks/nbstripout_setup.py
        language: python
        files: \.ipynb$
